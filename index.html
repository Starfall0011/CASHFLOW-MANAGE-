function nav(){document.getElementById("nav").innerHTML=T.map((x,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${x}</button>`).join("")}
function chart(){
const V=VP(),w=Math.max(600,V.length*115+20),h=150,bw=22;let mx=1;V.forEach(i=>{const p=per(i);mx=Math.max(mx,p.g,sa(p.a))});
let s=`<svg viewBox="0 0 ${w} ${h+26}" width="${w>600?w:'100%'}" role="img" aria-label="Gaji dan pengeluaran per periode">`;
V.forEach((ix,j)=>{const p=per(ix),x=20+j*115,gh=p.g/mx*h,eh=sa(p.a)/mx*h;
s+=`<rect x="${x}" y="${h-gh}" width="${bw}" height="${gh}" rx="4" fill="var(--ac)"/><rect x="${x+bw+4}" y="${h-eh}" width="${bw}" height="${eh}" rx="4" fill="var(--mu)"/><text x="${x+bw}" y="${h+16}" text-anchor="middle" font-size="12" fill="var(--mu)">${p.n.split(" – ")[0]}</text>`});
return "<div class='sc'>"+s+"</svg></div><div class='note'>Batang terang: gaji. Batang abu-abu: total pengeluaran.</div>"}
function ring(){
const p=per(pi),tot=sa(p.a),bt=sa(p.b),sel=p.g+(p.x||0)-tot;
let h=`<div class="card"><div class="grid"><div><div class="k">Gaji</div><div class="v">${R(p.g)}</div><div class="note" style="margin:2px 0 0">Diatur di menu Pemasukan</div></div><div><div class="k">Pengeluaran</div><div class="v">${R(tot)}</div></div>
<div><div class="k">Pemasukan dikurangi pengeluaran</div><div class="v ${sel<0?"bad":"good"}">${R(sel)}</div></div><div><div class="k">Anggaran</div><div class="v">${R(bt)}</div></div></div></div>
<div class="card"><b>Per kategori</b><div style="margin-top:10px">`;
CAT().forEach((c,i)=>{if(dc(i))return;const a=p.a[i]||0,b=p.b[i]||0,pc=b?Math.min(100,a/b*100):(a?100:0);
h+=`<div class="row"><span>${c} <button onclick="delCat(${i})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer">×</button></span><span class="${a>b?"bad":""}">${R(a)} <span class="k">/ ${R(b)}</span></span></div><div class="bar"><i class="${a>b?"o":""}" style="width:${pc}%"></i></div>`});
h+=`</div></div><div class="card"><b>Tren per periode</b>${chart()}</div>`;

const L=VP().map(i=>({...per(i),ix:i}));
h+=`<div class="card"><b>Semua periode</b><div class="sc" style="margin-top:8px"><table style="border-collapse:collapse;font-size:13px;white-space:nowrap"><tr><td></td>${L.map(q=>`<td style="padding:4px 8px;color:var(--mu)">${q.n.split(" – ")[0]} <button onclick="delPer(${q.ix})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer">×</button></td>`).join("")}</tr>`+[["Gaji",q=>q.g],["Pengeluaran",q=>sa(q.a)],["Selisih",q=>q.g+(q.x||0)-sa(q.a)],["Total aset",q=>sA(ast(q.ix).ak)]].map(r=>`<tr><td style="padding:4px 8px;color:var(--mu)">${r[0]}</td>${L.map(q=>`<td style="padding:4px 8px;text-align:right">${R(r[1](q))}</td>`).join("")}</tr>`).join("")+`</table></div><button class="btn" onclick="nextP()">+ Tambah periode berikutnya</button></div>`;
return h}
function tr(){
const q=per(pi),o=S.tx.filter(t=>t.d>=q.st&&t.d<=q.en).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
let h=`<div class="card"><b>Tambah transaksi</b><div class="f" style="margin-top:8px"><input id="d" type="date" value="${(()=>{const t=new Date().toISOString().slice(0,10);return (t<q.st||t>q.en)?q.st:t})()}"><select id="c">${CAT().map((c,i)=>dc(i)?"":`<option value="${i}">${c}</option>`).join("")}</select>
<input id="m" type="text" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="fmt(this)"><select id="s">${AT().map((a,k)=>S.da.includes(k)?"":`<option>${a}</option>`).join("")}</select></div>
<input id="n" placeholder="Keterangan" style="margin-top:8px"><button class="btn" onclick="add()">Simpan</button></div>
<div class="card"><b>Periode ${q.n} (${o.length})</b><div class='note' style='margin:4px 0'>Ubah tanggal periode di bagian atas.</div>`;
o.forEach(t=>{h+=`<div class="tx"><div><div>${t.n||"-"}</div><small>${t.d.slice(8)}/${t.d.slice(5,7)} · ${CAT()[t.c]} · ${t.s}</small></div><div style="display:flex;align-items:center;gap:4px"><b>${R(t.m)}</b><button onclick="del(${t.id})" aria-label="Hapus">×</button></div></div>`});
return h+`</div>`}
function add(){const m=U(document.getElementById("m").value);if(!m)return;
S.tx.push({id:++S.nid,d:document.getElementById("d").value,c:+document.getElementById("c").value,m,s:document.getElementById("s").value,n:document.getElementById("n").value});save();draw()}
function del(id){ask("Hapus transaksi ini?",()=>{S.tx=S.tx.filter(t=>t.id!=id);save();draw()})}
function bud(){
const q=per(pi);let h=`<div class="card"><b>Anggaran ${q.n}</b><div class="note" style="margin:4px 0 10px">Ubah angka lalu keluar dari kolom untuk menyimpan.</div>`;
CAT().forEach((c,i)=>{if(dc(i))return;h+=`<div class="row" style="align-items:center;margin-bottom:8px"><span>${c}</span><input type="text" inputmode="numeric" style="width:150px" value="${R(q.b[i]||0)}" oninput="fmt(this)" onchange="setb(${pi},${i},U(this.value))"><button onclick="delCat(${i})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer">×</button></div>`});
return h+`</div><div class="card"><b>Tambah kategori</b><div class="f" style="margin-top:8px;grid-template-columns:1fr auto"><input id="cn" placeholder="Nama kategori baru"><button class="btn" style="margin:0;width:auto;padding:0 14px" onclick="addTo('cc','cn')">Tambah</button></div><div class="note">Kategori baru muncul di Transaksi dan Ringkasan. Anggarannya diatur per periode di atas.</div></div>${S.dc.length||S.da.length||S.dp.length?`<button class="btn" onclick="ask('Tampilkan lagi kategori, aset, dan periode bawaan yang sudah dihapus?',restoreAll,'Pulihkan')" style="background:var(--card);color:var(--tx);border:1px solid var(--ln)">Pulihkan yang dihapus</button>`:""}<button class="btn" onclick="ask('Nolkan semua angka: transaksi, pemasukan, gaji, anggaran, dan saldo aset? Kategori, aset, dan periode tetap ada.',zeroNums,'Nolkan')" style="background:var(--card);color:var(--tx);border:1px solid var(--ln)">Nolkan semua angka</button><button class="btn" onclick="ask('Kembalikan semua data ke awal?',resetAll,'Reset')" style="background:var(--bad)">Reset data</button>`}
function incm(){const q=per(pi);

const o=S.inc.filter(t=>t.d>=q.st&&t.d<=q.en).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
const t0=new Date().toISOString().slice(0,10),d0=t0<q.st||t0>q.en?q.st:t0;
let h=`<div class="card"><b>Pemasukan ${q.n}</b><div class="grid" style="margin-top:8px"><div><div class="k">Gaji</div><input type="text" inputmode="numeric" value="${R(q.g)}" oninput="fmt(this)" onchange="setg(${pi},U(this.value))"></div><div><div class="k">Total pemasukan</div><div class="v good">${R(q.g+q.x)}</div></div></div></div><div class="card"><b>Tambah pemasukan</b><div class="f" style="margin-top:8px"><input id="iD" type="date" value="${d0}"><select id="iA">${AT().map((a,k)=>S.da.includes(k)?"":`<option>${a}</option>`).join("")}</select><input id="iM" type="text" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="fmt(this)" style="grid-column:1/-1"><input id="iN" placeholder="Keterangan" style="grid-column:1/-1"></div><button class="btn" onclick="addInc()">Simpan</button></div><div class="card"><b>Riwayat (${o.length})</b>`;
o.forEach(t=>{h+=`<div class="tx"><div><div>${t.n||"-"}</div><small>${t.d.slice(8)}/${t.d.slice(5,7)} · ${t.k||"-"}</small></div><div style="display:flex;align-items:center;gap:4px"><b class="good">${R(t.m)}</b><button onclick="delInc(${t.id})" aria-label="Hapus">×</button></div></div>`});
return h+"</div>"}
function aset(){const q=per(pi),a=ast(pi);
let h=`<div class="card"><b>Total aset ${q.n}</b><div class="v good" style="margin:6px 0 4px">${R(sA(a.ak))}</div><div class="note">Awal ${R(sA(a.aw))} · Selisih ${R(sA(a.ak)-sA(a.aw))}</div></div>`;
AT().forEach((n,k)=>{if(S.da.includes(k))return;const d=a.ak[k]-a.aw[k];h+=`<div class="card"><div class="row"><b>${n}</b><button onclick="delAs(${k})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer">×</button></div><div class="v good" style="margin:6px 0 10px">${R(a.ak[k])}</div><div class="row"><span class="k">Saldo awal</span><span>${R(a.aw[k])}</span></div><div class="row"><span class="k">Pemasukan</span><span class="good">+ ${R(a.inn[k])}</span></div><div class="row"><span class="k">Pengeluaran</span><span>- ${R(a.out[k])}</span></div><div class="row"><span class="k">Selisih</span><span class="${d<0?"bad":"good"}">${R(d)}</span></div><div class="row" style="align-items:center;margin-top:6px"><span class="k">Ubah saldo akhir</span><input type="text" inputmode="numeric" style="width:150px" value="${R(a.ak[k])}" oninput="fmt(this)" onchange="setA(${pi},${k},U(this.value))"></div></div>`});
h+=`<div class="note" style="margin:0 0 10px">Saldo akhir = saldo awal + pemasukan − pengeluaran dari aset yang dipilih di menu Pemasukan dan Transaksi. Mengubah saldo akhir menambahkan penyesuaian. Saldo awal otomatis dari akhir periode sebelumnya.</div><div class="card"><b>Tambah aset</b><div class="f" style="margin-top:8px;grid-template-columns:1fr auto"><input id="an" placeholder="Contoh: Reksa dana"><button class="btn" style="margin:0;width:auto;padding:0 14px" onclick="addTo('ac','an')">Tambah</button></div><div class="note">Aset baru otomatis muncul sebagai pilihan di menu Transaksi dan Pemasukan.</div></div>`;
return h}
function pbar(){const q=per(pi);return `<div class="card"><select onchange="pi=+this.value;draw()">${VP().map(i=>`<option value="${i}" ${i==pi?"selected":""}>${per(i).n}</option>`).join("")}</select><div class="f" style="margin-top:8px"><div><div class="k">Mulai</div><input type="date" value="${q.st}" onchange="setPD(${pi},'st',this.value)"></div><div><div class="k">Selesai</div><input type="date" value="${q.en}" onchange="setPD(${pi},'en',this.value)"></div></div></div>`}
function setPD(i,w,v){const p=PR(i);if(!v){draw();return}const st=w=="st"?v:p.st,en=w=="en"?v:p.en;if(st>en){ask("Tanggal mulai tidak boleh setelah tanggal selesai.",()=>{},"OK");draw();return}p[w]=v;save();draw()}
function draw(){if(S.dp.includes(pi)){const v=VP();if(v.length)pi=v[v.length-1]}nav();document.getElementById("app").innerHTML=pbar()+[ring,tr,incm,aset,bud][tab]()}
const TT=document.getElementById("ttl"),T0="Keuangan Saya";TT.value=S.title||T0;document.title=TT.value;applySkin();
TT.onchange=()=>{S.title=TT.value.trim()||T0;TT.value=S.title;document.title=S.title;save()};
TT.onkeydown=e=>{if(e.key=="Enter")TT.blur()};
if(!S.z2){Object.keys(S.as).map(Number).sort((a,b)=>a-b).forEach(i=>{const old=S.as[i];delete S.as[i];const b=ast(i).ak;S.as[i]=old.map((v,k)=>(v||0)-(b[k]||0))});S.z2=1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
draw();
startSync();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
</html>
